# Hyperparameters for the "xarm6_clutter" environment (xArm6 3D robot,
# clutter scene), read by oim/run_launch.py.
#
# Copied from point_clutter.yaml (task 11/12): xArm6 needs its own tuning
# (sampler/ADMM hyperparameters, execution model) independent of the point
# robot's, since a shared file meant every xArm6 tuning change also applied
# (untested) to the point robot. `world2d`'s fields are unused for this
# robot but kept for schema consistency with point_clutter.yaml.
#
# --env selects this file (oim/configs/{env}.yaml).

world3d:
  robot: xarm6 # point | xarm6
  planning_dt: 0.05 # sub-optimizer rollout timestep
  exec_timestep: 0.002 # execution-model MuJoCo timestep
  exec_iterations: 100
  exec_ls_iterations: 50

world2d:
  env: clutter # clutter | corridor | gate -- the 2D scenario itself
  mass: 2.0
  mu: 0.4 # object/support friction
  mu_c: 0.5 # robot/object friction
  f_max: 4.0 # cap on the normal contact force
  contact_action: false
  no_relocate: false
  no_obstacles: false

sampler:
  num_samples: 64 # xarm6's per-rollout collision cost is much higher than
  # the point mass's; 64 can exhaust an 11 GB GPU for the arm at higher
  # values -- confirmed 96 does not reliably help anyway (task 11).
  horizon: 15 # consensus horizon H, in steps of planning_dt
  robot_num_knots: 4
  robot_spline: linear
  object_spline: zero # object sub-optimizer always uses num_knots = horizon
  mppi:
    noise_level: 0.5
    temperature: 0.5
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1

admm:
  robot_opt: mppi # mppi | cem | ps | cbo
  object_opt: mppi
  n_admm: 8
  rho: 10.0
  gamma: 0.1
  eps_r: 0.5
  eps_s: 0.5
  # Residual-driven noise annealing (paper Algorithm 4 step 8) is off: the
  # primal residual never converges for this task, so noise just sits
  # pinned near noise_max instead of annealing -- confirmed to make
  # divergence worse (see cost_formulation_and_results_eval.md task 9).
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0

run:
  seed: 5
  seed0: 0
  steps: 300 # xarm6 needs longer than the point robot's 200 to converge
  # (task 11) -- some seeds only cross the goal tolerance after step 200.
  trials: 5
  # oim/sim3d/run.py's run_3d_admm (0.05/0.05) and run_3d_plain (0.06/0.10)
  # otherwise default to different "reached" thresholds, which would make
  # flat baselines look better than ADMM by construction in --eval. Both
  # get these same values, everywhere, in oim/run_launch.py.
  goal_pos_tol: 0.05
  goal_theta_tol: 0.05
