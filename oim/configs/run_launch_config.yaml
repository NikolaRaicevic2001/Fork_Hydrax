# Ablation: which ADMM knobs move performance vs flat MPPI.
# Cartesian product; ADMM-only axes (n_admm/rho/gamma/consensus_alpha/opts)
# collapse for mppi. ≈540 ADMM + 15 MPPI cells (~12–16 h with warp).
# Slice with: python -m oim.run_launch --only rho=1.0 --dry-run
#
# Not sweepable here (edit configs/xarm6.yaml or add an axis): temperature,
# noise_level, costs, robot_num_knots, rho_torque.

sweep:
  # Difficulty span: free space → tight gap (high rot/trans) → within push ceiling.
  task:
    - { script: open_table }
    - { script: shelf_gap }
    - { script: icra_sign }

  algorithm: [admm, mppi]
  robot_opt: [mppi]
  object_opt: [mppi]

  # Fixed at config (32 / 128). H↑ without more robot knots is confounded;
  # samples↑ does little while MPPI ESS≈1 (temperature not a CLI axis).
  horizon: []
  samples: []

  # Core ADMM questions: does the loop help, how stiff is consensus,
  # does proximal / proposal EMA stabilize coordination?
  n_admm: [1, 4, 8]
  rho: [0.1, 1.0, 10.0]
  gamma: [0.0, 0.1]
  consensus_alpha: [0.5, 1.0]

  # Seed already randomizes start/goal; leave these empty.
  start: []
  goal: []
  seed: [1]

fixed:
  steps: 1000
  headless: true
  warp: true
  record: true
  show_samples: true
  show_optimal: true  # logs object_plan/robot_plan (block disagreement)
