# Hyperparameters for the "gym2" environment (xArm6 3D robot, gym2 scene),
# read by oim/run_launch.py.
#
# Copied from xarm6_clutter.yaml, differing only in world3d.env: this is the
# same xArm6 sampler/ADMM tuning against a different 3D scene -- a single
# obstacle and a differently-sized T-block, converted from the
# Object-Informed-Manipulation (IsaacGym) repo's sim_task02 ("push the tee
# block avoiding an obstacle"). See oim/tasks/pusht.py's GYM2_GOAL/
# GYM2_OBSTACLES/GYM2_FOOTPRINT_KW and oim/models/xarm6_pusht_gym2/.
#
# --env selects this file (oim/configs/{env}.yaml), i.e. `--env gym2`.

world3d:
  robot: xarm6 # point | xarm6 -- gym2 only exists for xarm6
  env: gym2 # clutter | gym2 -- which 3D scene variant (xarm6 only)
  planning_dt: 0.05 # sub-optimizer rollout timestep
  exec_timestep: 0.002 # execution-model MuJoCo timestep
  exec_iterations: 100
  exec_ls_iterations: 50

world2d:
  env: clutter # clutter | corridor | gate -- unused for this robot, kept
  # for schema consistency with xarm6_clutter.yaml/point_clutter.yaml.
  mass: 2.0
  mu: 0.4 # object/support friction
  mu_c: 0.5 # robot/object friction
  f_max: 4.0 # cap on the normal contact force
  contact_action: false
  no_relocate: false
  no_obstacles: false

sampler:
  num_samples: 64 # xarm6's per-rollout collision cost is much higher than
  # the point mass's; 64 can exhaust an 11 GB GPU for the arm at higher
  # values -- confirmed 96 does not reliably help anyway (task 11).
  horizon: 15 # consensus horizon H, in steps of planning_dt
  robot_num_knots: 4
  robot_spline: linear
  object_spline: zero # object sub-optimizer always uses num_knots = horizon
  mppi:
    noise_level: 0.5
    temperature: 0.5
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1

admm:
  robot_opt: mppi # mppi | cem | ps | cbo
  object_opt: mppi
  n_admm: 8
  rho: 10.0
  gamma: 0.1
  eps_r: 0.5
  eps_s: 0.5
  # Residual-driven noise annealing (paper Algorithm 4 step 8) is off: the
  # primal residual never converges on the clutter scene, so noise just
  # sits pinned near noise_max instead of annealing -- confirmed to make
  # divergence worse there (see Tasks.md). Left off here too until gym2 is
  # itself characterized.
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0

run:
  seed: 5
  seed0: 0
  steps: 300 # xarm6 needs longer than the point robot's 200 to converge
  # on the clutter scene (task 11); kept as the starting default here too.
  trials: 1 # single fixed seed for now -- many ablations/baselines queued
  # up, per Shahid (Tasks.md); revisit once that backlog clears.
  goal_pos_tol: 0.05
  goal_theta_tol: 0.05
