# Defaults for the xArm6, loaded by every `examples/` script as its argparse
# defaults. Selected by `--robot`, which has no flag of its own. One file per
# robot rather than per scene, so a scene comparison is not confounded by
# tuning. `world2d` is unused here, kept for schema parity.

world3d:
  planning_dt: 0.05       # planner rollout timestep
  exec_timestep: 0.002    # execution model timestep
  exec_iterations: 100    # execution model solver iterations
  exec_ls_iterations: 50  # execution model line-search iterations

world2d:                  # unused for this robot
  mass: 2.0
  mu: 0.4                 # object/support friction
  mu_c: 0.5               # robot/object friction
  f_max: 4.0              # cap on the normal contact force

sampler:
  num_samples: 128
  horizon: 32             # consensus horizon H, in steps of planning_dt
  robot_num_knots: 4
  robot_spline: linear
  object_spline: zero     # the object block uses num_knots = horizon
  iterations: 1           # flat baselines only; the iterations-vs-n_admm axis
  mppi:
    noise_level: 0.5      # rad/s of joint velocity, against a +-1.0 ctrlrange
    # Compared against the *spread* of rollout costs, not their level. At 0.5
    # the effective sample size was 1.0-1.8 of 128 -- MPPI was argmin, not an
    # average. Not monotone: at >=20 the update averages the noise away and
    # the planner stops moving entirely. Mean final position error over 3
    # scenes: 0.49 (0.5), 0.23 (1), 0.22 (2), 0.45 (3), 0.71 (20).
    # Re-measure after changing `costs:` -- the spread scales with it.
    temperature: 1.0
  cem:
    num_elites: 8
    sigma_start: 0.5
    sigma_min: 0.1
  ps:
    noise_level: 0.5
  cbo:
    initial_noise_level: 0.5
    temperature: 0.5
    consensus_weight: 1.0
    noise_weight: 1.0
    step_size: 0.1
  # Merged over the method's block above. The object block samples normalized
  # wrench and the robot block rad/s, so one noise_level cannot serve both.
  object:
    mppi:
      noise_level: 0.5
      temperature: 0.5

costs:
  # --- shared by both blocks ---
  q_pos: 50.0             # running goal tracking, translation
  q_theta: 10.0           # running goal tracking, rotation
  qf_pos: 500.0           # terminal goal tracking, translation
  qf_theta: 500.0         # terminal goal tracking, rotation
  # Position and orientation are scored against equal tolerances (0.05 m,
  # 0.05 rad), and orientation is the binding one: met by 0% of flat-MPPI
  # runs against 33% for position. Raising q_theta to 50 cut mean final
  # orientation error 5.6x (0.585 -> 0.105) on every scene of 3 x 3 seeds,
  # but position then plateaued outside tolerance on all of them.

  # --- object block only ---
  w_effort: 0.01          # squared wrench
  w_obstacle: 60000.0     # clearance hinge on the object's footprint
  obstacle_margin: 0.015  # clearance below which that hinge activates

  # --- robot block only ---
  r_r: 0.05               # squared control effort; pinned at 0.10-0.12/step
  w_ee: 40.0              # approach: pull the tip toward the object
  r0: 0.02                # radius inside which approach goes slack
  w_align: 15.0           # stay behind the object relative to the reference
  # Widening the free cone to 40 deg was measured worse on every scene
  # (orientation error 0.105 -> 0.648, mean tilt 0.17 -> 0.25): this term is
  # what holds the tip on the push axis.
  gamma0_deg: 15.0        # alignment cone half-angle
  # Weighs 1 - cos(psi), not the angle, so ~10x the old angle-based weight.
  # At 0 the mean tilt is 1.08 rad; at 600 it starts costing orientation.
  w_tilt: 100.0           # keep the stick pointing down (3D only)
  w_tip_z: 8.0            # keep the tip at the block's mid-height (3D only)

admm:
  robot_opt: mppi         # mppi | cem | ps | cbo
  object_opt: mppi
  n_admm: 4
  rho: 10.0
  gamma: 0.1
  eps_r: 0.5              # the residual is a Frobenius norm over (2H, 3), so
  eps_s: 0.5              # the paper's 0.05 is unreachable and never fires
  # Residual-driven noise annealing (Alg. 4 step 8), off: the primal residual
  # never converges here, so the noise pins near noise_max instead of
  # annealing. Over 600 steps: final position error 4.65 on, 2.01 off.
  noise_min: 0.0
  noise_kappa: 0.0
  noise_max: 0.0
  consensus_alpha: 1.0    # EMA on A^o/A^r across rounds (1.0 = raw, as paper)

run:
  seed: 5
  steps: 1000
  # Recorded into every run file so `oim/run_eval.py` can re-derive success,
  # and so ADMM and a flat baseline are never scored against different
  # thresholds.
  goal_pos_tol: 0.05
  goal_theta_tol: 0.05
  show_samples: false     # trajectory overlay; costs time to compute + render
  show_optimal: false
