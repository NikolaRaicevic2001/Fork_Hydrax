# Planner/driver environment for the real robot: ROS 2 (rclpy) + CUDA JAX + MJX
# in ONE env, so pusht_real.py can be both the rclpy node and the planner.
#
# Why this file exists: ROS 2 Humble's apt rclpy is built for Python 3.10, but
# oim/JAX need >= 3.12. RoboStack (robostack-staging) ships ros-humble-* as
# conda packages for the Python you pick -- 3.12 here -- so both stacks share
# one env and match oim's requires-python. The lab already runs ros2_interface
# under pixi, so this fits the existing workflow.
#
# Setup:
#   cd oim/real3d && pixi install && pixi shell
#   pip install -e /path/to/Object-Informed-Manipulation-MJX --no-deps
#   python examples/pusht_real.py --replan-rate 2.5 --steps 400

[workspace]
name = "oim-real"
channels = ["conda-forge", "robostack-staging"]
platforms = ["linux-64"]

[dependencies]
numpy = "<2.4.0"
python = "3.12.*"   # robostack-staging ships ros-humble built for 3.12
pip = "*"
# ros-base bundles rclpy + the full ros2 CLI (topic/node/echo/...) + tf2 +
# common_interfaces (sensor/geometry/std/visualization msgs), so the driver,
# the marker script, and `ros2 topic list` all work from one dependency.
ros-humble-ros-base = "*"
ros-humble-tf2-tools = "*"   # view_frames / tf2_echo for TF debugging

[pypi-dependencies]
# Pinned to uv.lock: mujoco-mjx >= 3.9 dropped the nconmax/naconmax args that
# oim/task_base.py passes to mjx.make_data, so exact 3.8.0 is required.
# CPU JAX -> jax = "==0.8.3"
jax = { version = "==0.8.3", extras = ["cuda13"] }
mujoco = "==3.8.0"
mujoco-mjx = "==3.8.0"
scipy = "*"
# oim controller-build deps, pinned to match uv.lock (jax 0.8 compatible):
flax = "==0.12.4"
optax = "==0.2.6"
chex = "==0.1.91"
evosax = "==0.2.0"
interpax = "==0.3.12"
